# Alembic config for wet-mcp docs.db migrations.

[alembic]
# Path to migration scripts (relative to this ini file via %(here)s).
script_location = %(here)s/alembic

# Prepend project root to sys.path so env.py can import wet_mcp helpers if needed.
prepend_sys_path = .

# Use OS-default path separator for version_locations + prepend_sys_path lists.
path_separator = os

# Database URL is resolved at runtime by alembic/env.py from the
# WET_DOCS_DB_PATH environment variable or the ``-x db_path=/abs/path``
# CLI override. The value below is only a placeholder so Alembic does
# not error on bootstrap.
sqlalchemy.url = sqlite:///./.wet-mcp-alembic-placeholder.db


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
