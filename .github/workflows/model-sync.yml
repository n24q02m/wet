name: Model Sync

# Weekly benchmark-driven model-pin sync for the wet live benchmark.
#
# Source of truth: the hull model-candidates publisher (weekly Mon 04:41 UTC
# sticky PR committing data/model-candidates.json, schema_version 1). This
# workflow runs after it and reads the profile "agentic" (task profile of the
# wet MCP benchmark). Selection is deterministic: the first candidate with
# weak_evidence == false AND pareto_rank == 0 is the proposed OpenRouter slug.
# When no strong candidate exists, the sticky issue records the weak-board
# state and NO pin PR is opened — the sync never guesses a model.
#
# When a strong candidate differs from the current pin (vars.OPENROUTER_MODEL,
# else bench/model.txt), this workflow files or updates ONE sticky issue and
# opens a single-file PR against bench/model.txt (label model-pin). It NEVER
# merges the PR, never sets the repo variable, and never edits code defaults —
# moving the paid benchmark model stays a labelled, human-approved change.

on:
  schedule:
    - cron: "11 7 * * 1" # weekly Mon 07:11 UTC — trails hull's 04:41 publish + merge window
  workflow_dispatch:

permissions:
  contents: write # single-file pin branch commit
  issues: write # sticky dashboard issue
  pull-requests: write # pin PR

concurrency:
  group: model-sync
  cancel-in-progress: false

env:
  MODEL_CANDIDATES_URL: https://raw.githubusercontent.com/n24q02m/hull/main/data/model-candidates.json
  TASK_PROFILE: agentic
  PIN_FILE: bench/model.txt
  PIN_BRANCH: model-sync/pin
  PIN_LABEL: model-pin
  STICKY_TITLE: "[model-sync] weekly model pin"
  # Read through the vars context (no actions:read needed) so the pin
  # comparison mirrors exactly what benchmark.yml resolves.
  VAR_MODEL: ${{ vars.OPENROUTER_MODEL }}
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    name: Sync benchmark model pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout pin file state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch published candidates
        run: |
          code="$(curl -sS -o model-candidates.json -w '%{http_code}' "${MODEL_CANDIDATES_URL}")" || code=000
          if [ "${code}" != "200" ]; then
            echo "::error::Fetching hull model-candidates.json returned HTTP ${code}. The snapshot is committed by hull's weekly model-candidates publisher (sticky PR); until that lands on main the raw URL does not serve yet. Failing closed — the sync never guesses a model."
            exit 1
          fi

      - name: Select strong candidate
        id: select
        env:
          TASK_PROFILE: agentic
        run: |
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os

          data = json.load(open("model-candidates.json"))
          if data.get("schema_version") != 1:
              raise SystemExit(f"unsupported schema_version {data.get('schema_version')!r} — failing closed")
          task = data.get("tasks", {}).get(os.environ["TASK_PROFILE"])
          if task is None:
              raise SystemExit(f"task profile {os.environ['TASK_PROFILE']!r} missing from snapshot — failing closed")
          candidates = task.get("candidates") or []
          strong = [
              c for c in candidates
              if c.get("pareto_rank") == 0 and c.get("weak_evidence") is False
          ]
          print(f"generated_at={data.get('generated_at', 'unknown')}")
          print("strong=" + "; ".join(c.get("or_slug") or c.get("litellm_id") or "?" for c in strong[:3]))
          if not strong:
              print("proposed=")
              print("proposed_slug=")
          else:
              print(f"proposed={strong[0]['litellm_id']}")
              print(f"proposed_slug={strong[0].get('or_slug') or strong[0]['litellm_id']}")
          PY

      - name: Resolve current effective pin
        id: current
        env:
          PROPOSED: ${{ steps.select.outputs.proposed }}
        run: |
          pin=""
          if [ -f "${PIN_FILE}" ]; then
            pin="$(tr -d ' \t\r\n' < "${PIN_FILE}")"
          fi
          if [ -n "${VAR_MODEL}" ]; then
            current="${VAR_MODEL}"
            source="vars.OPENROUTER_MODEL"
          elif [ -n "${pin}" ]; then
            current="${pin}"
            source="${PIN_FILE}"
          else
            current=""
            source="unset"
          fi
          if [ -z "${PROPOSED}" ]; then
            state="no-strong-candidate"
          elif [ "${current}" != "${PROPOSED}" ]; then
            state="pr-needed"
          else
            state="unchanged"
          fi
          printf 'current=%s\nsource=%s\nstate=%s\n' "${current}" "${source}" "${state}" >> "${GITHUB_OUTPUT}"

      - name: Locate sticky issue
        id: sticky
        env:
          REPO: ${{ github.repository }}
        run: |
          num="$(gh issue list --repo "${REPO}" --state open --limit 200 --json number,title \
            | python3 -c 'import json,os,sys;t=os.environ["STICKY_TITLE"];items=[i for i in json.load(sys.stdin) if i["title"]==t];print(items[0]["number"] if items else "")')"
          printf 'number=%s\n' "${num}" >> "${GITHUB_OUTPUT}"

      - name: Open pin PR
        id: pr
        if: steps.current.outputs.state == 'pr-needed'
        env:
          REPO: ${{ github.repository }}
          PROPOSED: ${{ steps.select.outputs.proposed_slug }}
          GENERATED_AT: ${{ steps.select.outputs.generated_at }}
          STRONG: ${{ steps.select.outputs.strong }}
          CURRENT: ${{ steps.current.outputs.current }}
          CURRENT_SOURCE: ${{ steps.current.outputs.source }}
        run: |
          python3 - <<'PY'
          import os

          proposed = os.environ["PROPOSED"]
          with open("pr.md", "w") as f:
              f.write(
                  "## model-sync pin proposal\n\n"
                  + f"- proposed pin: `{proposed}`\n"
                  + f"- current effective pin: `{os.environ['CURRENT'] or 'unset'}` ({os.environ['CURRENT_SOURCE']})\n"
                  + f"- source: hull `model-candidates.json` (generated_at {os.environ['GENERATED_AT']})\n"
                  + f"- strong candidates (top): {os.environ['STRONG']}\n\n"
                  + "Single-file change to `bench/model.txt`. Merging this PR moves the paid benchmark model; "
                  + "the [model-sync] workflow never merges its own PRs.\n"
              )
          PY
          gh label create "${PIN_LABEL}" --repo "${REPO}" --force \
            --color D93F0B --description "Benchmark model pin proposal" >/dev/null
          head_sha="$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          if gh api "repos/${REPO}/git/ref/heads/${PIN_BRANCH}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${PIN_BRANCH}" -F force=true -f sha="${head_sha}" >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${PIN_BRANCH}" -f sha="${head_sha}" >/dev/null
          fi
          old_sha="$(gh api "repos/${REPO}/contents/${PIN_FILE}?ref=main" --jq '.sha' 2>/dev/null || true)"
          content_b64="$(printf '%s\n' "${PROPOSED}" | base64 -w0)"
          jq -n --arg m "chore(bench): pin benchmark model to ${PROPOSED}" \
            --arg c "${content_b64}" --arg b "${PIN_BRANCH}" --arg s "${old_sha}" \
            '{message: $m, content: $c, branch: $b} + (if $s == "" then {} else {sha: $s} end)' \
            | gh api -X PUT "repos/${REPO}/contents/${PIN_FILE}" --input - >/dev/null
          pr_url="$(gh pr create --repo "${REPO}" --base main --head "${PIN_BRANCH}" \
            --title "model-sync: pin benchmark model to ${PROPOSED}" \
            --body-file pr.md --label "${PIN_LABEL}")"
          printf 'url=%s\nnumber=%s\n' "${pr_url}" "${pr_url##*/}" >> "${GITHUB_OUTPUT}"

      - name: Create or patch sticky issue
        id: upsert
        env:
          REPO: ${{ github.repository }}
          PROPOSED: ${{ steps.select.outputs.proposed_slug }}
          GENERATED_AT: ${{ steps.select.outputs.generated_at }}
          STRONG: ${{ steps.select.outputs.strong }}
          CURRENT: ${{ steps.current.outputs.current }}
          CURRENT_SOURCE: ${{ steps.current.outputs.source }}
          STATE: ${{ steps.current.outputs.state }}
          STICKY_NUM: ${{ steps.sticky.outputs.number }}
          PR_NUM: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          export NOW="$(date -u '+%Y-%m-%d %H:%M UTC')"
          python3 - <<'PY'
          import os

          repo = os.environ["REPO"]
          proposed = os.environ["PROPOSED"]
          current = os.environ["CURRENT"]
          source = os.environ["CURRENT_SOURCE"]
          state = os.environ["STATE"]
          pr_num = os.environ["PR_NUM"]

          state_label = {
              "pr-needed": "**proposal open**",
              "unchanged": "unchanged",
              "no-strong-candidate": "**no strong candidate this week — no pin change proposed**",
          }[state]
          rows = [
              ("last checked (UTC)", os.environ["NOW"]),
              ("source", f"hull `model-candidates.json`, profile agentic (generated_at {os.environ['GENERATED_AT']})"),
              ("proposed text-chain leader", f"`{proposed}`" if proposed else "(none — weak board)"),
              ("strong candidates (top)", os.environ["STRONG"] or "(none)"),
              ("current effective pin", f"`{current}` ({source})" if current else f"unset ({source})"),
          ]
          if pr_num:
              rows.append(("pin PR", f"#{pr_num} (open — human review required)"))
          rows.append(("state", state_label))
          table = "| field | value |\n| --- | --- |\n" + "\n".join(
              f"| {k} | {v} |" for k, v in rows
          )
          with open("sticky.md", "w") as f:
              f.write(
                  "## [model-sync] weekly model pin\n\n"
                  + table
                  + "\n\n"
                  + "**Apply:** merge the labelled `model-pin` PR (updates `bench/model.txt`), or set the repo variable directly:\n"
                  + f"`gh variable set OPENROUTER_MODEL --repo {repo} --body \"{proposed}\"`.\n\n"
                  + "This workflow never merges the PR and never sets the variable — moving the paid benchmark model is a human-approved change.\n"
              )
          PY
          if [ -z "${STICKY_NUM}" ]; then
            url="$(gh issue create --repo "${REPO}" --title "${STICKY_TITLE}" --body-file sticky.md)"
            echo "number=${url##*/}" >> "${GITHUB_OUTPUT}"
            echo "Created sticky issue ${url}"
          else
            gh issue edit "${STICKY_NUM}" --repo "${REPO}" --body-file sticky.md >/dev/null
            echo "number=${STICKY_NUM}" >> "${GITHUB_OUTPUT}"
            echo "Patched sticky issue #${STICKY_NUM}"
          fi
          if [ "${STATE}" = "pr-needed" ] && [ -n "${PR_URL}" ]; then
            gh issue comment "${STICKY_NUM}" --repo "${REPO}" \
              --body "Proposal updated at ${NOW}: effective pin \`${CURRENT:-unset}\` (${CURRENT_SOURCE}) → proposed \`${PROPOSED}\`. Pin PR: ${PR_URL}" >/dev/null
          fi
          cat sticky.md >> "${GITHUB_STEP_SUMMARY}"
