name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable
      publish_existing_tag:
        description: "Recovery only: publish an already-created tag (e.g. v3.1.0), skipping semantic-release. Use when the auto-computed version's tag name is permanently reserved by a GitHub immutable release."
        required: false
        type: string
        default: ""
      recreate_container:
        description: "Recovery only: delete the exact existing CF Container ID before redeploying the selected image."
        required: false
        type: boolean
        default: false
      incident_no_canary:
        description: "Security incident only: skip the public post-deploy canary while an exact-host edge block is active; verify manually after unblocking."
        required: false
        type: boolean
        default: false

env:
# Release lane: merge to main auto-publishes stable; beta only via manual dispatch (release_type=beta).
  # workflow_dispatch keeps release_type as an explicit override.
  RELEASE_TYPE: ${{ github.event_name == 'push' && 'stable' || inputs.release_type }}

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # =================== Release ===================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released || steps.forced.outputs.released }}
      tag: ${{ steps.release.outputs.tag || steps.forced.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.forced.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease || steps.forced.outputs.is_prerelease }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Dry-run PSR (no_operation_mode => --noop: no commit/tag/push/release) purely to
      # learn the version it WOULD publish, so the PyPI-collision guard below can fire
      # BEFORE the real run creates a git tag or GitHub Release. Same action + SHA and
      # same prerelease inputs as the real step, run against the same untouched checkout,
      # so the computed version is identical. Gated the same way as the real step so it
      # is skipped in the publish_existing_tag recovery path (that path deliberately
      # reuses a known tag/version and does not need this guard).
      - uses: n24q02m/better-semantic-release@6e6884898bfe1ac34a0bc64ed62f54a21562df23 # v1.6.1
        id: dryrun
        if: inputs.publish_existing_tag == ''
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta
          no_operation_mode: true

      # PSR silently no-ops when it can't find a fix:/feat: commit since the last
      # tag -- e.g. a bot PR squash-merged with a non-conventional subject (the
      # commit-title no-bump trap the pr-title CI check guards at merge time; this
      # step is the release-time backstop for anything that slipped past it, or a
      # repo predating that check). released=false alone is not an error (it is
      # the normal outcome of a docs-only/chore-only window), so this only warns.
      # Skipped in the publish_existing_tag recovery path for the same reason the
      # dry-run above is skipped there.
      - name: Warn if commits exist since last tag but PSR computed no release
        if: inputs.publish_existing_tag == '' && steps.dryrun.outputs.released != 'true'
        run: |
          set -uo pipefail
          highest_tag="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -z "$highest_tag" ]; then
            echo "No existing tags -- nothing to compare."
            exit 0
          fi
          commit_count="$(git rev-list "${highest_tag}..HEAD" --count)"
          if [ "$commit_count" -gt 0 ]; then
            echo "::warning::PSR computed no release (released=false) but ${commit_count} commit(s) exist since ${highest_tag}. This is expected if they are all chore/docs-only, but if one of them should have bumped the version (e.g. a bot-authored fix squashed with a non-conventional subject), inspect 'git log ${highest_tag}..HEAD --oneline' before assuming there is nothing to release."
          else
            echo "OK: no commits since ${highest_tag} -- released=false is expected."
          fi

      # Fail early and loudly if the version PSR intends to publish already exists on
      # PyPI. PyPI never allows reusing a version number, so a hit here means the git
      # history has diverged from the registry. Catching it here converts two nasty
      # failure modes -- PSR silently setting released=false on a matching tag (every
      # publish job skipped) and an opaque PyPI 400 deep inside `uv publish` -- into one
      # explicit, actionable error, before any tag or Release is created.
      - name: Guard against re-publishing an already-published PyPI version
        if: steps.dryrun.outputs.released == 'true'
        env:
          COMPUTED_VERSION: ${{ steps.dryrun.outputs.version }}
        run: |
          set -uo pipefail
          PKG='wet-mcp'
          URL="https://pypi.org/pypi/${PKG}/${COMPUTED_VERSION}/json"
          echo "Checking PyPI for ${PKG} ${COMPUTED_VERSION} before semantic-release tags anything..."

          # PyPI JSON API for a specific release (behaviour verified live, unauthenticated):
          #   200                 -> the version EXISTS  -> COLLISION
          #   404                 -> the version is FREE -> proceed
          #   empty/000/anything else -> UNKNOWN (network, 5xx, 429, curl failure) -> refuse
          # A transient error must NEVER be read as "free": that could let a real
          # collision slip through, which is worse than the bug this guard prevents.
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${URL}" 2>/dev/null)"

          if [ "${status}" = "200" ]; then
            echo "::error::Computed release version ${COMPUTED_VERSION} already exists on PyPI as ${PKG} ${COMPUTED_VERSION} (${URL} returned 200). PyPI NEVER allows re-publishing a version number, even one later yanked. This almost always means the git history diverged from what was published to PyPI -- tags/commits were rewritten while the registry kept the original releases. Do NOT retry the same version: bump PAST the already-published range (higher than any version ever published) and dispatch the release again."
            exit 1
          fi

          if [ "${status}" = "404" ]; then
            echo "OK: ${PKG} ${COMPUTED_VERSION} is not on PyPI (404) -- safe to publish."
            exit 0
          fi

          echo "::error::Could not verify whether ${PKG} ${COMPUTED_VERSION} exists on PyPI: ${URL} returned HTTP '${status:-<no response>}' (expected 200 or 404). Refusing to proceed so a genuine collision cannot slip through as a false 'free'. Re-run the release once the registry is reachable."
          exit 1

      - uses: n24q02m/better-semantic-release@6e6884898bfe1ac34a0bc64ed62f54a21562df23 # v1.6.1
        id: release
        if: inputs.publish_existing_tag == ''
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta

      - uses: python-semantic-release/publish-action@6d89e2de8d40ecb3717316ecbbf15a6fa8ea9039 # v10.6.2
        if: inputs.publish_existing_tag == '' && steps.release.outputs.released == 'true'
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Use existing tag (immutable-release recovery)
        id: forced
        if: inputs.publish_existing_tag != ''
        run: |
          TAG="${{ inputs.publish_existing_tag }}"
          VERSION="${TAG#v}"
          {
            echo "released=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is_prerelease=false"
          } >> "$GITHUB_OUTPUT"

  # =================== Publish to PyPI ===================
  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv build
      - name: Publish to PyPI
        run: uv publish


  # =================== Publish to MCP Registry ===================
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release, publish-pypi]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Update server.json version
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          jq --arg v "$VERSION" '
            .version = $v |
            .packages = [.packages[] | .version = $v]
          ' server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          set +e
          out=$(./mcp-publisher publish 2>&1)
          rc=$?
          echo "$out"
          set -e
          if [ $rc -ne 0 ] && echo "$out" | grep -q "cannot publish duplicate version"; then
            echo "duplicate version already in registry - idempotent recovery, treating as success"
            exit 0
          fi
          exit $rc

  # ============================================================================
  # Sync to Plugin Marketplace
  # ============================================================================
  sync-marketplace:
    name: Sync to Marketplace
    needs: [release, publish-mcp-registry]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          repositories: claude-plugins

      - name: Dispatch plugin sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/n24q02m/claude-plugins/dispatches \
            -f event_type=plugin-sync \
            -f 'client_payload[repo]=wet-mcp' \
            -f 'client_payload[tag]=${{ needs.release.outputs.tag }}'

  deploy-cf:
    name: Deploy Cloudflare Worker+Container
    # Builds the http-slim image on a GitHub Linux runner and deploys it to
    # Cloudflare so any release == CF live on that version — a beta dispatch redeploys
    # the beta, a stable dispatch is maintainer-gated (replaces the
    # manual local deploy_cf.py step + its Windows Docker OOM). It only needs the
    # `release` job because deploy_cf.py builds and pushes its own
    # Cloudflare-internal image, so this deploy remains independent of public
    # artifact publication.
    # NOTE: in CI the template renders the image at the NEW tag, so deploy_cf.py's
    # auto-rollback (prev_ref != new) is inert here; a failed canary still fails
    # this job (exit 1, no silent bad deploy). Live-image prev_ref for true CI
    # rollback is a tracked follow-up.
    needs: [release]
    # Gated off 2026-09-13: the CF deploy token was removed as off-manifest
    # (no entry in mcp-secret-routing.json = process violation). Re-enable =
    # create a proper token (CF dashboard -> manifest entry -> repo secret
    # CF_DEPLOY_TOKEN), then set the repo variable CF_DEPLOY_ENABLED=true.
    if: vars.CF_DEPLOY_ENABLED == 'true' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Setup Bun (bunx wrangler)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install worker deps (wrangler bundles worker.ts, needs @cloudflare/containers)
        run: bun install --frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # CF_DEPLOY_TOKEN needs D1:edit on top of Workers/Containers edit: the
      # script now applies migrations/ to the remote D1 before the worker rolls
      # (wrangler deploy never did — issue #1617).
      - name: Deploy to Cloudflare (build http-slim + push + migrate D1 + deploy + canary)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          CF_VECTORIZE_ID: ${{ secrets.CF_VECTORIZE_ID }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          IMAGE_TAG: ${{ needs.release.outputs.version }}
        run: |
          extra_args=()
          if [[ "${{ inputs.recreate_container }}" == "true" ]]; then
            extra_args+=(--recreate-container)
          fi
          if [[ "${{ inputs.incident_no_canary }}" == "true" ]]; then
            extra_args+=(--no-canary)
          fi
          python scripts/deploy_cf.py --from-template --tag "${IMAGE_TAG}" "${extra_args[@]}"
