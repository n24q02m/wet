name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # Phase 2: weekly Tier 1 docs refresh — Sunday 06:00 UTC.
    - cron: '0 6 * * 0'

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # PR Title Lint (Conventional Commits subset)
  # ============================================================================
  # Squash-merge uses the PR title as the commit subject and bypasses the
  # local enforce-commit pre-commit commit-msg hook (bot PRs never run local
  # git hooks). Without a server-side check, a bot title like
  # "Sentinel: [HIGH] Fix ..." squash-merges with a non-conventional subject
  # -> PSR's commit parser silently ignores it -> no version bump, even for a
  # security fix. This job only surfaces a red check; it does not block
  # merge (no required-status-check rule), so the person merging still must
  # retype the squash-commit subject to start with fix:/feat: when this is red.
  pr-title:
    name: Validate PR title (Conventional Commits subset)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Repo rule: only feat: and fix: (feedback_commit_prefix.md). This is
          # narrower than PSR's own default allowed_tags (which also treats
          # perf: as patch-worthy) -- we enforce the project convention here,
          # not just what PSR itself would accept.
          types: |
            fix
            feat
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.

  lint-and-test:
    name: Lint & Test (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate immutable benchmark contract fixtures
        run: uv run --no-sync python tests/search_quality/run_contract.py validate-fixtures

      - name: Run Ruff check
        run: uv run --no-sync ruff check .

      - name: Run Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Run ty type check
        run: uv run --no-sync ty check

      - name: Run tests with coverage
        run: uv run --no-sync pytest --tb=short --cov=wet --cov-report=xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  docs-sync-check:
    name: Docs Sync Check (CLAUDE.md <-> AGENTS.md)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify CLAUDE.md and AGENTS.md are body-identical
        run: bash .pre-commit-hooks/sync-claude-agents.sh

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  refresh-tier1:
    name: Refresh Tier 1 docs index (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Sized from measurement, not from the 6-hour default. The twelve green
    # runs before #1590 finished in 2-7 minutes, but they were green because
    # the ingest pipeline discarded every page, so they measure setup and
    # discovery only. The first run that actually ingested (30736692116) got
    # through 28 of the 50 libraries in 7m33s with the headless leg erroring
    # out instantly, which extrapolates to ~14 minutes for the full list. The
    # browser install below turns those instant errors back into real renders:
    # 190 URLs escalated to headless in that run, and at the 60s crawler_timeout
    # ceiling with _MAX_CONCURRENT_OPS=6 that is ~32 minutes of worst-case
    # rendering on top. 45 covers measured base plus that arithmetic ceiling
    # while still cutting a genuine hang eight times shorter than the default.
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install chromium headless shell
        # The canary crawls through the production strategy chain
        # basic_http -> tls_spoof -> headless (crawler.py
        # _build_scraping_agent), and the docs freshness target it guards is
        # ">= 90% of Tier 1 within 7 days" (docs/BENCHMARKS.md), measured over
        # that whole chain. Every other environment that runs this chain has a
        # browser: the image installs one (Dockerfile, unless SLIM=1 drops the
        # local legs on purpose) and so does the contributor setup
        # (CONTRIBUTING.md). CI never did, which stayed invisible while the
        # ingest pipeline was discarding pages anyway, and surfaced the week
        # after #1590 unblocked it as 190 "All strategies failed ... last
        # error: headless: BrowserType.launch: Executable doesn't exist"
        # lines in run 30736692116.
        #
        # Only the headless shell is installed, not full chromium: the shell
        # is the binary that run named (chromium_headless_shell-1228) because
        # nothing here ever launches a headed browser, and it is the smaller
        # download. --with-deps pulls the matching system libraries so this
        # does not become a second silent missing-binary failure the first
        # time the runner image drops one.
        run: uv run playwright install --with-deps chromium-headless-shell

      - name: Build Tier 1 index
        run: uv run python scripts/build_tier1_index.py

      - name: Upload metrics artifact
        # Covers the build step exiting non-zero, and -- now that the job has
        # a timeout-minutes -- a hang that the runner cancels. It does NOT
        # cover the runner being killed: `if: always()` is still evaluated by
        # the runner, so in run 30736692116 this step was reported as skipped
        # after "The runner has received a shutdown signal". For that case the
        # only mitigation is upstream: build_tier1_index.py rewrites the
        # metrics file after every library, so whatever the job manages to
        # upload is a real partial record rather than nothing.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier1-index-metrics
          path: ~/.wet/tier1_index_metrics.json
          if-no-files-found: warn
