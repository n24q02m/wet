name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Dispatch runs the same lint, test, CodeQL and docs-sync jobs as a push, so
  # a dispatched run is a real test run. `job` adds one on-demand job on top:
  # the jobs that used to start by themselves (a weekly cron and a
  # workflow_run listener) run only when someone dispatches them.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit for the main-integrity job to verify (default: the tip of the dispatched ref)"
        required: false
        type: string
        default: ""
      job:
        description: "Extra job to run alongside the CI jobs: benchmark (live MCP benchmark, spends provider credit), refresh-tier1 (Tier 1 docs canary) or canary-drill (refresh-tier1 fails on purpose so the canary alert job runs; on main it files or updates the canary issue)"
        required: false
        type: choice
        default: none
        options:
          - none
          - benchmark
          - refresh-tier1
          - canary-drill

permissions:
  contents: read
  pull-requests: write

# A newer run on the same ref supersedes the older one, except a benchmark
# run: it spends provider credit, so a second benchmark dispatch queues
# behind the first instead of cancelling it mid-run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.job }}
  cancel-in-progress: ${{ inputs.job != 'benchmark' }}

jobs:
  # ============================================================================
  # PR Title Lint (Conventional Commits subset)
  # ============================================================================
  # Squash-merge uses the PR title as the commit subject and bypasses the
  # local enforce-commit pre-commit commit-msg hook (bot PRs never run local
  # git hooks). Without a server-side check, a bot title like
  # "Sentinel: [HIGH] Fix ..." squash-merges with a non-conventional subject
  # -> PSR's commit parser silently ignores it -> no version bump, even for a
  # security fix. This job only surfaces a red check; it does not block
  # merge (no required-status-check rule), so the person merging still must
  # retype the squash-commit subject to start with fix:/feat: when this is red.
  pr-title:
    name: Validate PR title (Conventional Commits subset)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Repo rule: only feat: and fix: (feedback_commit_prefix.md). This is
          # narrower than PSR's own default allowed_tags (which also treats
          # perf: as patch-worthy) -- we enforce the project convention here,
          # not just what PSR itself would accept.
          types: |
            fix
            feat
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.

  lint-and-test:
    name: Lint & Test (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The macOS interpreter from setup-python is the python.org framework
      # build, whose sqlite3 has no enable_load_extension. sqlite-vec never
      # loads there, so every vector-search test skipped on macOS and the
      # vector paths of db.py went untested on that OS. uv's own CPython can
      # load extensions, like the one `uvx --python 3.13` installs for users,
      # so macOS syncs onto it. Elsewhere this is uv's default preference.
      UV_PYTHON_PREFERENCE: ${{ matrix.os == 'macos-latest' && 'only-managed' || 'managed' }}

    permissions:
      contents: read
      pull-requests: write
      # The Codecov upload authenticates with this job's OIDC token.
      id-token: write
    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate immutable benchmark contract fixtures
        run: uv run --no-sync python tests/search_quality/run_contract.py validate-fixtures

      - name: Run Ruff check
        run: uv run --no-sync ruff check .

      - name: Run Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Run ty type check
        run: uv run --no-sync ty check

      - name: Run tests with coverage
        run: uv run --no-sync pytest --tb=short --cov=wet --cov-report=xml

      # Codecov refuses a tokenless upload for the default branch, and no upload token
      # is stored, so the upload authenticates with OIDC and fails the job when Codecov
      # refuses it. Pull requests skip it: a fork or Dependabot run cannot always mint
      # an OIDC token, and the required check must not depend on Codecov being reachable.
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  docs-sync-check:
    name: Docs Sync Check (CLAUDE.md <-> AGENTS.md)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify CLAUDE.md and AGENTS.md are body-identical
        run: bash .pre-commit-hooks/sync-claude-agents.sh

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  refresh-tier1:
    name: Refresh Tier 1 docs index
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'refresh-tier1' || inputs.job == 'canary-drill')
    runs-on: ubuntu-latest
    # Sized from measurement, not from the 6-hour default. The twelve green
    # runs before #1590 finished in 2-7 minutes, but they were green because
    # the ingest pipeline discarded every page, so they measure setup and
    # discovery only. The first run that actually ingested (30736692116) got
    # through 28 of the 50 libraries in 7m33s with the headless leg erroring
    # out instantly, which extrapolates to ~14 minutes for the full list. The
    # browser install below turns those instant errors back into real renders:
    # 190 URLs escalated to headless in that run, and at the 60s crawler_timeout
    # ceiling with _MAX_CONCURRENT_OPS=6 that is ~32 minutes of worst-case
    # rendering on top. 45 covers measured base plus that arithmetic ceiling
    # while still cutting a genuine hang eight times shorter than the default.
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Fail on purpose for a canary drill
        # report-canary-failure runs only after this job fails on main, so a
        # healthy canary never exercises it. A canary-drill dispatch fails
        # here, before any real work, so the alert path runs end to end.
        if: inputs.job == 'canary-drill'
        run: |
          echo "::error::canary-drill: refresh-tier1 failed on purpose to exercise the canary alert"
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install chromium headless shell
        # The canary crawls through the production strategy chain
        # basic_http -> tls_spoof -> headless (crawler.py
        # _build_scraping_agent), and the docs freshness target it guards is
        # ">= 90% of Tier 1 within 7 days" (docs/BENCHMARKS.md), measured over
        # that whole chain. Every other environment that runs this chain has a
        # browser: the image installs one (Dockerfile, unless SLIM=1 drops the
        # local legs on purpose) and so does the contributor setup
        # (CONTRIBUTING.md). CI never did, which stayed invisible while the
        # ingest pipeline was discarding pages anyway, and surfaced the week
        # after #1590 unblocked it as 190 "All strategies failed ... last
        # error: headless: BrowserType.launch: Executable doesn't exist"
        # lines in run 30736692116.
        #
        # Only the headless shell is installed, not full chromium: the shell
        # is the binary that run named (chromium_headless_shell-1228) because
        # nothing here ever launches a headed browser, and it is the smaller
        # download. --with-deps pulls the matching system libraries so this
        # does not become a second silent missing-binary failure the first
        # time the runner image drops one.
        run: uv run playwright install --with-deps chromium-headless-shell

      - name: Build Tier 1 index
        run: uv run python scripts/build_tier1_index.py

      - name: Upload metrics artifact
        # Covers the build step exiting non-zero, and -- now that the job has
        # a timeout-minutes -- a hang that the runner cancels. It does NOT
        # cover the runner being killed: `if: always()` is still evaluated by
        # the runner, so in run 30736692116 this step was reported as skipped
        # after "The runner has received a shutdown signal". For that case the
        # only mitigation is upstream: build_tier1_index.py rewrites the
        # metrics file after every library, so whatever the job manages to
        # upload is a real partial record rather than nothing.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier1-index-metrics
          path: ~/.wet/tier1_index_metrics.json
          if-no-files-found: warn
          retention-days: 5

  # ============================================================================
  # Canary alert: when a dispatched refresh-tier1 fails, open or update one
  # tracking issue. Folded in from canary-alert.yml, whose workflow_run
  # trigger listened for a failed scheduled CI run; the job now runs inside
  # the same run, after refresh-tier1, so no second workflow is needed.
  # Schedules only ever ran on the default branch, so the issue is filed
  # only for a main run: a refresh-tier1 dispatched on a branch to try a
  # change reports in its own run, not in the tracking issue. A canary-drill
  # dispatch on main runs this job for real against a deliberate failure;
  # close the drill issue once it has been read.
  # ============================================================================
  report-canary-failure:
    name: Open or update the canary failure issue
    needs: refresh-tier1
    if: failure() && github.event_name == 'workflow_dispatch' && (inputs.job == 'refresh-tier1' || inputs.job == 'canary-drill') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # `issues: write` covers both the issue and the label it is filed under.
      issues: write
      # `actions: read` lets the job read the failed job's record and log;
      # without it the issue would carry a link and no excerpt.
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: File or update the canary failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          JOB_NAME: Refresh Tier 1 docs index
          LABEL: canary-failure
          DRILL: ${{ inputs.job == 'canary-drill' }}
        run: |
          set -euo pipefail

          # Create the marker label first so the dedupe query below cannot fail
          # on a repository that has never had a canary failure. Idempotent.
          gh label create "$LABEL" --repo "$REPO" \
            --color B60205 \
            --description "Tier 1 canary run failed" \
            2>/dev/null || true

          # This run is still in progress, so its log archive does not exist
          # yet; the failed job's own record and log do, through the jobs API.
          # A failed `gh api` still prints the error body on stdout, so each
          # capture is reset on failure; otherwise that JSON would land in the
          # issue as if it were the log.
          JOB=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq ".jobs[] | select(.name == \"$JOB_NAME\") | [.id, .started_at, .completed_at] | @tsv" \
            2>/dev/null) || JOB=""
          JOB_ID=""
          JOB_STARTED_AT=""
          JOB_COMPLETED_AT=""
          if [ -n "$JOB" ]; then
            IFS=$'\t' read -r JOB_ID JOB_STARTED_AT JOB_COMPLETED_AT <<< "$JOB"
          fi

          # Prefer the lines that end at the failing step's error; a killed
          # runner sometimes marks no step failed, in which case the tail of
          # the whole log is the only thing that shows what it was doing.
          # curl, not `gh api`: job logs carry ANSI colour codes and `gh api`
          # refuses to print a body with terminal escape sequences. The
          # endpoint redirects to a pre-signed URL; curl drops the token on
          # that cross-host redirect.
          LOG=""
          if [ -n "$JOB_ID" ]; then
            LOG=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$REPO/actions/jobs/$JOB_ID/logs" 2>/dev/null) || LOG=""
          fi
          EXCERPT=$(printf '%s\n' "$LOG" | awk '
            { line[NR] = $0 }
            /##\[error\]/ { last = NR }
            END {
              if (!last) exit
              for (i = (last > 24 ? last - 24 : 1); i <= last; i++) print line[i]
            }')
          if [ -z "$EXCERPT" ]; then
            EXCERPT=$(printf '%s\n' "$LOG" | tail -n 25)
          fi
          if [ -z "$(printf '%s' "$EXCERPT" | tr -d '[:space:]')" ]; then
            EXCERPT="(no log could be read; open the run and read it there)"
          fi

          TITLE="Tier 1 canary failed on $RUN_SHA"
          BODY_FILE=$(mktemp)
          {
            if [ "$DRILL" = "true" ]; then
              TITLE="Tier 1 canary drill on $RUN_SHA"
              echo "This is a canary drill: \`refresh-tier1\` failed on purpose"
              echo "(\`job=canary-drill\`) to exercise this alert. Close it once read."
              echo
            fi
            echo "The Tier 1 docs canary (\`refresh-tier1\` in CI) failed."
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| run | $RUN_URL |"
            echo "| run id | \`$RUN_ID\` |"
            echo "| commit | \`$RUN_SHA\` |"
            echo "| started | ${JOB_STARTED_AT:-unknown} |"
            echo "| ended | ${JOB_COMPLETED_AT:-unknown} |"
            echo
            echo "Last lines of the failing log:"
            echo
            echo '```'
            echo "$EXCERPT"
            echo '```'
            echo
            echo "Partial metrics, when the runner lived long enough for the"
            echo "upload step to run, are in the \`tier1-index-metrics\` artifact"
            echo "on that run. \`complete: false\` in that file means the script"
            echo "was interrupted and the counts cover only the libraries listed."
          } > "$BODY_FILE"

          # Dedupe: one open issue holds the whole streak. Without this, every
          # red run would file another issue and the canary would become its
          # own source of backlog churn.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label "$LABEL" \
            --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "Appending to open canary issue #$EXISTING"
            gh issue comment "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE"
          else
            echo "No open canary issue; filing a new one"
            gh issue create --repo "$REPO" \
              --title "$TITLE" \
              --label "$LABEL" \
              --body-file "$BODY_FILE"
          fi

  # ============================================================================
  # Live MCP benchmark (dispatch with job=benchmark). Folded in from
  # benchmark.yml, which was already dispatch-only.
  # ============================================================================
  benchmark:
    name: Live MCP benchmark (200/500/200)
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Pin browser path outside the checkout
        # The benchmark server runs under an isolated HOME, so patchright cannot
        # see the default ~/.cache/ms-playwright browsers. Pin the browser path
        # via env: it flows through wet_server_env's `**os.environ` into the
        # spawned server regardless of the isolated home. It must live outside
        # the checkout: the release gate requires `git status --porcelain` to be
        # empty, and an untracked browser dir inside the workspace fails it.
        # (`runner.temp` is not available in job-level env, hence GITHUB_ENV.)
        shell: bash
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "${GITHUB_ENV}"

      - name: Checkout exact dispatch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install headless browser binaries
        # The extract suite's `headless` fallback (patchright/chromium) is
        # exercised by anti-bot fixture URLs; browser binaries are not part
        # of `uv sync` and must be fetched once per job.
        run: uv run python -m patchright install chromium

      - name: Require a clean checkout before spending
        # The gate rejects artifacts whose provenance records a dirty tree.
        # Fail here, before any paid provider call, instead of after the run.
        shell: bash
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "::error::Checkout is dirty after setup; the release gate would reject this run. Offending paths:"
            printf '%s\n' "${dirty}"
            exit 1
          fi

      - name: Require a real provider credential
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::No real wet provider credential is projected into this run. Sync it from skret; the benchmark never mocks credentials."
            exit 1
          fi

      - name: Resolve benchmark model
        shell: bash
        env:
          VAR_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          # Precedence: explicit repo variable first, then the model-sync pin
          # file. Both unset stays fail-closed — the benchmark never picks a
          # paid model silently.
          model="${VAR_MODEL}"
          src="vars.OPENROUTER_MODEL"
          if [ -z "${model}" ] && [ -f bench/model.txt ]; then
            pin="$(tr -d ' \t\r\n' < bench/model.txt)"
            if [ -n "${pin}" ]; then
              model="${pin}"
              src="bench/model.txt"
            fi
          fi
          if [ -z "${model}" ]; then
            echo "::error::No benchmark model resolved: vars.OPENROUTER_MODEL is unset and bench/model.txt is empty. The benchmark never picks a paid model silently — set the repo variable or merge a [model-sync] pin PR before dispatching."
            exit 1
          fi
          echo "OPENROUTER_MODEL=${model}" >> "${GITHUB_ENV}"
          echo "Resolved benchmark model ${model} from ${src}"

      - name: Pre-flight provider spend gate
        shell: bash
        env:
          OPENROUTER_SPEND_CAP_USD: ${{ vars.OPENROUTER_SPEND_CAP_USD }}
        run: |
          cap="${OPENROUTER_SPEND_CAP_USD:-5}"
          if [ -z "${OPENROUTER_SPEND_CAP_USD}" ]; then
            echo "NOTE: no vars.OPENROUTER_SPEND_CAP_USD set — using DEFAULT cap ${cap} USD. Set the variable to make the bound an explicit user decision."
          fi
          resp="$(curl -sf -H "Authorization: Bearer ${OPENROUTER_API_KEY}" https://openrouter.ai/api/v1/credits)" || {
            echo "::error::Cannot read OpenRouter credits endpoint — failing closed before spending."
            exit 1
          }
          avail="$(printf '%s' "$resp" | python3 -c 'import json,sys;d=json.load(sys.stdin)["data"];print(round(d["total_credits"]-d["total_usage"],2))')"
          echo "Pre-flight: available credit ${avail} USD; run cap ${cap} USD; model ${OPENROUTER_MODEL}"
          awk -v a="$avail" -v c="$cap" 'BEGIN{exit (a>=c)?0:1}' || {
            echo "::error::Available OpenRouter credit (${avail} USD) is below this run's cap (${cap} USD). Top up or raise vars.OPENROUTER_SPEND_CAP_USD consciously."
            exit 1
          }

      - name: Validate immutable fixtures
        run: uv run python tests/search_quality/run_contract.py validate-fixtures

      - name: Execute live MCP benchmark
        env:
          BENCHMARK_ARTIFACT: ${{ runner.temp }}/wet-benchmark-contract.json
          # The in-run spend guard enforces the same cap as the pre-flight
          # (blank -> the same 5 USD default) against this run's own spend.
          OPENROUTER_SPEND_CAP_USD: ${{ vars.OPENROUTER_SPEND_CAP_USD }}
        run: uv run python tests/search_quality/run_contract.py run --output "${BENCHMARK_ARTIFACT}"

      - name: Upload exact-SHA benchmark artifact
        # Runs before the gate (and unconditionally) so a failed gate still
        # leaves the measured artifact downloadable — diagnosing the next
        # failure must not require scraping job logs.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wet-benchmark-contract-${{ github.sha }}
          path: ${{ runner.temp }}/wet-benchmark-contract.json
          # ignore, not error: with `if: always()` this step also runs on a
          # pre-flight abort (no model / no credit) where no artifact exists —
          # a second failure line there would mask the real error.
          if-no-files-found: ignore
          retention-days: 5

      - name: Gate measured artifact against exact SHA
        env:
          BENCHMARK_ARTIFACT: ${{ runner.temp }}/wet-benchmark-contract.json
          GIT_SHA: ${{ github.sha }}
        run: uv run python tests/search_quality/run_contract.py gate --artifact "${BENCHMARK_ARTIFACT}" --expected-commit "${GIT_SHA}"
